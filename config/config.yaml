    images: ${paths.roots.mav}/${task.cam}/data


image:
    # [width, height]
    original_image_shape: [640, 480]  # [640, 480]
    crop_image_shape: [ 630, 476 ] # [504, 504] [630, 476]
    patch_size: 82  # 32  82  
    train_patch_size: 82  
    patch_border: 6 # pixels 2 4 6
    

train:
    train_batch_size: 20 # 20  12 
    val_batch_size: 20
    
    num_patches_per_image: 70 # 120
    
    accumulate_grad_batches: 4
    learning_rate: 1e-4   # 1e-4    

    fast_dev_run: False  # True False
    overfit_batches: 0

    patience: 15
    max_epochs: 200
    check_val_every_n_epoch: 2
    num_sanity_val_steps: 1
    log_every_n_steps: 10 # 100
    
val:
    num_patch_pairs_to_save: 80

test:
    batch_size: 4

