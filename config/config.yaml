log_level: WARNING  # TRACE WARNING

experiment:

    # model: arjan #  benny bishop  alan  jon  
    # linux: 50

    # model: andor # crew  tesla  akila  junior  
    # linux: 53

    model: alex # eddie tom  harris  sam  abby  frank
    linux: 57 

    # model: vader # potter  pulse  peyton 
    # linux: 75 

    params: 9mil
    heads: 2 
    name: ${experiment.model}_${experiment.linux}_linux

    eda_mode: False  # True False


image:
    # [width, height]
    original_image_shape: [640, 480]  # [640, 480]
    crop_image_shape: [ 630, 476 ] # [504, 504] [630, 476]
    patch_size: 32 # 36 
    patch_size_folder: 26 # 32 
    patch_padding: 2
    jitter_reference: False
    jitter_target: True
    max_perturb: 5
    patch_min_confidence: -1
    bad_patch_min_confidence: 0.2


train:
    batch_size: 20 # 40 
    accumulate_grad_batches: 4
    learning_rate: 1e-4   # 1e-4    

    fast_dev_run: False  # True False
    overfit_batches: 0

    patience: 20
    max_epochs: 300
    check_val_every_n_epoch: 2
    num_sanity_val_steps: 1
    log_every_n_steps: 25 
    
val:
    num_patch_pairs_to_save: 80

test:
    batch_size: 40


loggers: # []
   - neptune


paths:
    roots:
        ws: /home/stud/ath/ath_ws
        mav: ${paths.roots.ws}/datasets/${task.dataset}/${task.video}/mav0
        project: ${paths.roots.ws}/keypoint_matcher
        output: ${paths.roots.project}/output/${experiment.name}

    output:
        logs: ${paths.roots.output}/logs
        checkpoints: ${paths.roots.output}/checkpoints
        train_images: ${paths.roots.output}/images/train
        val_images: ${paths.roots.output}/images/val
        test_images: ${paths.roots.output}/images/test

    images: ${paths.roots.mav}/${task.cam}/data

    csv:
        train: ${paths.roots.ws}/datasets/match_april/${image.patch_size_folder}_inline/train.csv
        val: ${paths.roots.ws}/datasets/match_april/${image.patch_size_folder}_inline/val.csv
        test: ${paths.roots.ws}/datasets/match_april/${image.patch_size_folder}_inline/test.csv


