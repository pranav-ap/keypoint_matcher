log_level: TRACE  # TRACE WARNING

task:
    dataset: monado_slam

    # MOO07_mapping_easy  MOO11_short_3_backandforth
    video: MOO11_short_3_backandforth
    videos:
        train:
            - MOO09_short_1_updown 
            - MOO07_mapping_easy
        val:
            - MOO11_short_3_backandforth
            - MOO10_short_2_panorama
        test:
            - Nothing

    cam: cam0
    cams:
        - cam0
        - cam1

    single_video_mode: True
    eda_mode: False  # True False

experiment:
    model: mobilenet  # resnet
    name: ${experiment.model}_single_video_mode 

paths:
    roots:
        ws: /home/stud/ath/ath_ws # /home/stud/ath/ath_ws  D:/thesis_code
        mav: ${paths.roots.ws}/datasets/${task.dataset}/${task.video}/mav0
        project: ${paths.roots.ws}/keypoint_matcher
        output: ${paths.roots.project}/output

    output:
        logs: ${paths.roots.output}/${experiment.name}/logs
        checkpoints: ${paths.roots.output}/${experiment.name}/checkpoints
        train_images: ${paths.roots.output}/${experiment.name}/images/train
        val_images: ${paths.roots.output}/${experiment.name}/images/val
        test_images: ${paths.roots.output}/${experiment.name}/images/test

    matches: ${paths.roots.ws}/keypoint_dataset_pipeline/output/train/train_data.hdf5
    images: ${paths.roots.mav}/${task.cam}/data

image:
    # [width, height]
    original_image_shape: [640, 480]  # [640, 480]
    patch_size: 32
    patch_border: 2 # pixels 2 4

train:
    train_batch_size: 4
    val_batch_size: 4
    num_patches_per_image: 200

    fast_dev_run: False  # True False
    overfit_batches: 0

    patience: 5
    max_epochs: 10
    check_val_every_n_epoch: 2
    num_sanity_val_steps: 1
    log_every_n_steps: 1
    accumulate_grad_batches: 1
    learning_rate: 1e-4

val:
    num_patch_pairs_to_save: 24

test:
    batch_size: 4

loggers:
    # - tensorboard
    - neptune

