log_level: TRACE  # TRACE WARNING

experiment:
    # sun_dune sun_space 
    model: wed_rama 
    linux: 50  
    params: 4mil
    heads: 1
    datasets: mix
    stddev: 4
    # name: ${experiment.model}_${experiment.linux}_linux_${experiment.params}_${experiment.heads}_heads_${experiment.datasets}_dataset_${experiment.stddev}_stddev
    name: ${experiment.model}_${experiment.linux}_linux_${experiment.params}_${experiment.heads}_heads_${experiment.datasets}_dataset

task:
    dataset: monado_slam

    video: MOO09_short_1_updown
    videos:
        train:
            normal: []
            blur: []
            all:  []
            
            all_missing:
                # - MOO10_short_2_panorama
                - MOO02_hand_puncher_2
                - MOO03_hand_shooter_easy
                - MOO04_hand_shooter_hard
                - MOO06_inspect_hard
                - MOO08_mapping_hard

        val:
            normal: []
            blur:  []
            all:  []
            all_missing: # []
                - MOO05_inspect_easy
                - MOO07_mapping_easy
                - MOO09_short_1_updown
                - MOO10_short_2_panorama
                - MOO11_short_3_backandforth

        test:
            normal: []
            all: []

    cam: cam0
    cams:
        - cam0
        - cam1
        # - cam2
        # - cam3

    eda_mode: False  # True False

paths:
    roots:
        ws: /home/stud/ath/ath_ws
        # ws: D:/thesis_code
        mav: ${paths.roots.ws}/datasets/${task.dataset}/${task.video}/mav0
        project: ${paths.roots.ws}/keypoint_matcher
        output: ${paths.roots.project}/output/${experiment.name}

    output:
        logs: ${paths.roots.output}/logs
        checkpoints: ${paths.roots.output}/checkpoints
        train_images: ${paths.roots.output}/images/train
        val_images: ${paths.roots.output}/images/val
        test_images: ${paths.roots.output}/images/test

    matches: 
        all: /home/stud/ath/ath_ws/keypoint_dataset_pipeline/output/output_all/train/train_data.hdf5
        normal: /home/stud/ath/ath_ws/keypoint_dataset_pipeline/output/output_normal/train/train_data.hdf5
        blur: /home/stud/ath/ath_ws/keypoint_dataset_pipeline/output/output_blur/train/train_data.hdf5
        all_missing: /home/stud/ath/ath_ws/keypoint_dataset_pipeline/output/output_all_missing/train/train_data.hdf5

    images: ${paths.roots.mav}/${task.cam}/data

image:
    # [width, height]
    original_image_shape: [640, 480]  # [640, 480]
    crop_image_shape: [ 630, 476 ] # [504, 504] [630, 476]
    patch_size: 82  # 82  128  64
    train_patch_size: 82  
    patch_border: 6 # pixels 2 4 6
    

train:
    train_batch_size: 15  
    val_batch_size: 15
    num_patches_per_image: 70 # 120

    fast_dev_run: False  # True False
    overfit_batches: 0

    patience: 10
    max_epochs: 200
    check_val_every_n_epoch: 2
    num_sanity_val_steps: 1
    log_every_n_steps: 20 # 100
    accumulate_grad_batches: 6
    learning_rate: 1e-4 # 1e-4    

val:
    num_patch_pairs_to_save: 80

test:
    batch_size: 4

loggers:
    #  - tensorboard
   - neptune
