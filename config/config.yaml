        - cam0
        - cam1

    eda_mode: False  # True False

experiment:
    model: smallnet  # resnet mobilenet
    name: ${experiment.model}

paths:
    roots:
        ws: /home/stud/ath/ath_ws
        # ws: D:/thesis_code
        mav: ${paths.roots.ws}/datasets/${task.dataset}/${task.video}/mav0
        project: ${paths.roots.ws}/keypoint_matcher
        output: ${paths.roots.project}/output/${experiment.name}

    output:
        logs: ${paths.roots.output}/logs
        checkpoints: ${paths.roots.output}/checkpoints
        train_images: ${paths.roots.output}/images/train
        val_images: ${paths.roots.output}/images/val
        test_images: ${paths.roots.output}/images/test

    matches: /home/stud/ath/ath_ws/keypoint_dataset_pipeline/output_normal/train/train_data.hdf5
    images: ${paths.roots.mav}/${task.cam}/data

image:
    # [width, height]
    original_image_shape: [640, 480]  # [640, 480]
    patch_size: 32
    patch_border: 2 # pixels 2 4

train:
    train_batch_size: 2  #  4
    val_batch_size: 2  #  4
    num_patches_per_image: 120

    fast_dev_run: False  # True False
    overfit_batches: 0

    patience: 5
    max_epochs: 20 # 200
    check_val_every_n_epoch: 2
    num_sanity_val_steps: 1
    log_every_n_steps: 50
    accumulate_grad_batches: 1
    learning_rate: 1e-4

val:
    num_patch_pairs_to_save: 80

test:
    batch_size: 4

loggers:
    #  - tensorboard
   - neptune

